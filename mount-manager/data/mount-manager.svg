<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#2671c9"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7dd8"/>
      <stop offset="1" stop-color="#1c5aa8"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0a4"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- back of the folder -->
  <path d="M14 26h34l8 10h58a6 6 0 0 1 6 6v56a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z"
        fill="url(#folderBack)"/>
  <!-- an external drive peeking out -->
  <g filter="url(#shadow)">
    <rect x="30" y="34" width="68" height="30" rx="6" fill="url(#disk)"/>
    <rect x="38" y="42" width="34" height="4" rx="2" fill="#9a9996"/>
    <circle cx="88" cy="49" r="4" fill="#26a269"/>
  </g>
  <!-- front of the folder -->
  <path d="M8 52h112a6 6 0 0 1 6 6v38a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6V58a6 6 0 0 1 6-6z"
        fill="url(#folderFront)"/>
  <path d="M2 62h124v4H2z" fill="#ffffff" opacity="0.18"/>
  <!-- the mount arrow -->
  <g filter="url(#shadow)">
    <path d="M64 60v22H50l22 24 22-24H80V60z" fill="url(#arrow)"/>
  </g>
</svg>
